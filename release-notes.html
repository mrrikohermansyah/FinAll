      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-label">Menu Utama</div>
          <a href="dashboard.html" class="nav-item">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
            <span>Dashboard</span>
          </a>
          <a href="transaction.html" class="nav-item">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></span>

          </a>
          <a href="reports.html" class="nav-item">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span>
            <span>Laporan</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-label">Lainnya</div>
          <a href="settings.html" class="nav-item">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
            <span>Pengaturan</span>
          </a>
          <a href="release-notes.html" class="nav-item active">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></span>
            <span>Release Notes</span>
          </a>
          <a href="index.html" class="nav-item">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
            <span>Home</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" data-user-avatar>?</div>
          <div class="user-info">
            <div class="user-name" data-user-name>Guest</div>
            <div class="user-email" data-user-email>Silakan login</div>
          </div>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn tooltip" data-theme-toggle data-tooltip="Ganti Tema"></button>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" data-sidebar-toggle><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
          <div>
            <div class="page-title">Release Notes</div>
            <div class="page-breadcrumb">Riwayat perubahan dan pembaruan aplikasi</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn tooltip" data-theme-toggle data-tooltip="Ganti Tema"></button>
        </div>
      </header>

      <main class="page-content">
        <div class="card" style="margin-bottom:32px;border:none;background:linear-gradient(135deg,rgba(95,141,126,0.08),rgba(167,196,160,0.05));">
          <div class="card-body" style="padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;">
            <div>
              <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--primary);margin-bottom:8px;">Current Version</div>
              <div style="font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1;" id="currentVersion">v1.0.0</div>
              <div style="font-size:14px;color:var(--text-secondary);margin-top:8px;" id="currentVersionDate">Release: 01 Agustus 2026</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">Build Number</div>
              <div style="font-size:24px;font-weight:700;color:var(--primary);" id="currentBuild">#001</div>
              <div style="margin-top:16px;">
                <a href="register.html" class="btn btn-primary btn-sm">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                  Coba Sekarang
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="release-container" id="releaseList"></div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const releases = [
      {
        version: '1.0.0',
        build: '001',
        date: '2026-08-01',
        label: 'Initial Release',
        sections: {
          'Authentication System': [
            'Register dengan email & password',
            'Login/logout dengan Remember Me option',
            'Forgot Password via email reset link',
            'Session Login & Persistence',
            'Route Protection (Dashboard dll. butuh login)',
            'User hanya bisa lihat data miliknya sendiri (Firestore Rules)'
          ],
          'Dashboard': [
            'Total Gaji Bulan Ini dengan input manual',
            'Total Sudah Dialokasikan + Sisa Gaji real-time',
            'Progress Bar Alokasi',
            'Circular Progress Gaji Terpakai',
            'Pie Chart komposisi per kategori (Chart.js)',
            'Bar Chart nominal per kategori (Chart.js)',
            'Line Chart trend pembayaran',
            'Payment Status Count: Sudah Dibayar / Belum Dibayar',
            'History gaji tiap bulan tersimpan'
          ],
          'Transactions': [
            'Tambah, Edit, Hapus transaksi',
            'Field: Nama, Nominal, Kategori, Tanggal, Bulan',
            'Admin Transaction option: Ya / Tidak + pilihan nominal',
            'Perhitungan otomatis: Total = Nominal + Admin',
            'Persentase terhadap gaji otomatis',
            'Status pembayaran (checklist) dengan card visual hijau',
            'Color Code: Sage, Orange, Yellow badge',
            'Search, Sort, Pagination',
            'Filter: Bulan, Tahun, Status, Warna, Kategori',
            'Export CSV, Print',
            'Tampilan Table & Card toggle'
          ],
          'Reports': [
            'Ringkasan: Gaji, Alokasi, Sisa, Tetap, Berubah, Tabungan',
            'Total admin transaksi',
            'Pie, Bar, Line Chart visualisasi',
            'Trend 6 bulan terakhir',
            'Kategori terbesar',
            'Tabel detail periode terpilih'
          ],
          'Settings': [
            'Master Kategori Transaksi (Tambah/Edit/Hapus)',
            'Pilihan Warna Kategori',
            'Master Admin Transaction (Tambah/Edit/Hapus + status aktif)',
            'Preferensi: Dark Mode toggle, Animasi',
            'Profil: Ubah nama, ganti password',
            'Version Info + link Release Notes'
          ],
          'User Experience': [
            'Loading Screen + Skeleton Loader',
            'Toast Notification (Success/Error/Warning/Info)',
            'Delete Confirmation Dialog',
            'Auto Currency Format Indonesia (Rp)',
            'Dark Mode & Light Mode toggle',
            'Keyboard Shortcuts: Ctrl+K, Ctrl+N, Ctrl+D',
            'Floating Add Button',
            'Ripple Effect & Smooth Transition',
            'Card Animation & Hover states',
            'Empty State illustration',
            'Responsive: Mobile, Tablet, Desktop'
          ],
          'Deployment Ready': [
            'Firebase Hosting compatible',
            'GitHub Pages compatible',
            'Firestore Security Rules siap pakai',
            'Version Check + Update Popup via version.json'
          ]
        }
      }
    ];

    function renderReleases() {
      const list = document.getElementById('releaseList');
      if (!list) return;
      list.innerHTML = releases.map((r, i) => {
        const sectionsHtml = Object.entries(r.sections).map(([title, items]) => `
          <div style="margin-bottom:18px;">
            <div class="release-note-title">${title}</div>
            <ul class="release-features">
              ${items.map(it => `<li>${Sanitize.string(it)}</li>`).join('')}
            </ul>
          </div>
        `).join('');
        return `
          <div class="release-item animate-fade-up animate-delay-${(i % 4) + 1}">
            <div class="release-dot">${i === 0 ? '🚀' : (releases.length - i)}</div>
            <div class="release-version">v${Sanitize.string(r.version)} — ${Sanitize.string(r.label)}</div>
            <div class="release-date-badge">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              ${DateUtils.format(r.date, 'date')} · Build ${Sanitize.string(r.build)}
            </div>
            ${sectionsHtml}
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      setupSidebar();
      fetch('version.json?_=' + Date.now()).then(r => r.json()).then(d => {
        const vEl = document.getElementById('currentVersion');
        if (vEl && d.version) vEl.textContent = 'v' + d.version;
        const bEl = document.getElementById('currentBuild');
        if (bEl && d.build) bEl.textContent = '#' + d.build;
        const dEl = document.getElementById('currentVersionDate');
        if (dEl && d.releaseDate) dEl.textContent = 'Release: ' + DateUtils.format(d.releaseDate, 'date');
      }).catch(() => {});
      renderReleases();

      if (typeof firebase !== 'undefined') {
        initFirebase();
        App.auth.onAuthStateChanged(user => {
          App.currentUser = user;
          Loader.hide(300);
          try { renderUserInfo(); } catch(e){}
          const logoutBtns = document.querySelectorAll('[data-logout]');
          const profileArea = document.querySelector('.user-card');
          if (profileArea && !user) {
            profileArea.onclick = () => window.location.href = 'login.html';
            profileArea.style.cursor = 'pointer';
          }
        });
      } else {
        Loader.hide(300);
      }
    });
  </script>
</body>
</html>
